<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>訂單自動拆解 2.0</title>
    <style>
        body { font-family: sans-serif; padding: 15px; background: #f4f7f6; }
        .card { background: white; padding: 20px; border-radius: 12px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); border: 1px solid #ddd; }
        textarea { width: 100%; height: 200px; font-size: 16px; padding: 12px; box-sizing: border-box; border: 1px solid #ccc; border-radius: 8px; }
        button { width: 100%; padding: 18px; background: #28a745; color: white; border: none; border-radius: 8px; font-size: 20px; font-weight: bold; margin-top: 10px; cursor: pointer; }
        .res-title { margin-top: 25px; font-size: 20px; font-weight: bold; color: #333; padding-bottom: 5px; border-bottom: 2px solid #28a745; }
        .item { font-size: 24px; margin-top: 12px; display: flex; justify-content: space-between; }
        .qty { color: #d9534f; font-weight: bold; }
    </style>
</head>
<body>
    <div class="card">
        <h2>📋 貼上 LINE 訂單內容</h2>
        <textarea id="orderInput" placeholder="直接複製貼上訂單..."></textarea>
        <button onclick="parseOrder()">一鍵自動拆解</button>
        <div class="res-title">今日備貨統計：</div>
        <div id="result"></div>
    </div>

    <script>
        function parseOrder() {
            const text = document.getElementById('orderInput').value;
            const lines = text.split('\n');
            const total = { '鮭魚': 0, '五花豚': 0, '唐揚雞': 0, '鯛魚': 0, '鱈魚': 0, '煙燻鴨': 0, '鰻魚': 0 };

            // 1. 定義菜單編號清單 (用來排除)
            const menuIDs = ['801','802','803','804','805','806','601','602','603','604','605','606','607','608','301','302'];
            
            // 2. 定義食材對應關鍵字
            const config = [
                { name: '鮭魚', keys: ['鮭魚','601','602','603','801','802'] },
                { name: '五花豚', keys: ['五花豚','豚','肉','602','604','605','608','803'] },
                { name: '唐揚雞', keys: ['唐揚','雞','603','606','607','608','301'] },
                { name: '鯛魚', keys: ['鯛魚','601','604','606','804'] },
                { name: '鱈魚', keys: ['鱈魚','605','607','302'] },
                { name: '煙燻鴨', keys: ['鴨','805'] },
                { name: '鰻魚', keys: ['鰻','806'] }
            ];

            lines.forEach(line => {
                if (!line.trim()) return;

                // 找出行內所有數字
                let matches = line.match(/\d+/g);
                if (!matches) return;

                // 核心邏輯：過濾掉在 menuIDs 裡的編號，剩下的才是數量
                let quantity = 0;
                let filteredNums = matches.filter(n => !menuIDs.includes(n));
                
                if (filteredNums.length > 0) {
                    // 如果有剩下的數字，取最後一個當作數量
                    quantity = parseFloat(filteredNums[filteredNums.length - 1]);
                } else {
                    // 如果這行只有編號(例如「602 10個」變成只有 602)，那就抓最後一個數字
                    quantity = parseFloat(matches[matches.length - 1]);
                }

                // 判斷倍率 (雙拼 0.5, 單拼 1)
                let isDouble = line.includes('拼') || (line.includes('60') && !line.includes('80') && !line.includes('30'));

                config.forEach(item => {
                    if (item.keys.some(k => line.includes(k))) {
                        let rate = isDouble ? 0.5 : 1;
                        // 特殊處理：如果行內同時有 80 或 30 開頭，強制算 1 (因為那是單拼)
                        if (line.includes('80') || line.includes('30')) rate = 1;
                        total[item.name] += (quantity * rate);
                    }
                });
            });

            let outputHtml = '';
            for (let name in total) {
                if (total[name] > 0) {
                    outputHtml += `<div class="item"><span>📍 ${name}</span><span class="qty">${total[name]} 份</span></div>`;
                }
            }
            document.getElementById('result').innerHTML = outputHtml || '讀取不到有效訂單，請確認有輸入數量。';
        }
    </script>
</body>
</html>
