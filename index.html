<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>訂單明細與總量統計</title>
    <style>
        body { font-family: sans-serif; padding: 15px; background: #f4f4f4; color: #333; }
        .card { background: white; padding: 20px; border-radius: 12px; border: 2px solid #000; max-width: 700px; margin: auto; box-shadow: 5px 5px 0px #000; }
        textarea { width: 100%; height: 200px; font-size: 16px; padding: 12px; box-sizing: border-box; border: 2px solid #ccc; border-radius: 8px; }
        button { width: 100%; padding: 20px; background: #007AFF; color: #fff; border: none; border-radius: 8px; font-size: 22px; font-weight: bold; margin-top: 10px; cursor: pointer; transition: 0.2s; }
        button:active { background: #0056b3; transform: scale(0.98); }
        .section-title { margin-top: 30px; font-size: 22px; font-weight: bold; background: #000; color: #fff; padding: 8px 15px; border-radius: 5px; }
        .detail-box { margin-top: 10px; background: #fff; border: 1px solid #ddd; padding: 15px; border-radius: 8px; }
        .order-block { margin-bottom: 20px; padding-bottom: 10px; border-bottom: 2px dashed #eee; }
        .order-header { font-weight: bold; color: #007AFF; margin-bottom: 5px; font-size: 18px; }
        .item-row { font-size: 24px; display: flex; justify-content: space-between; padding: 8px 0; border-bottom: 1px solid #f0f0f0; }
        .qty-total { color: #ff0000; font-weight: bold; }
    </style>
</head>
<body>
    <div class="card">
        <h2>📑 多單批量拆解統計</h2>
        <textarea id="orderInput" placeholder="在此連續貼上多張訂單內容..."></textarea>
        <button onclick="processOrders()">✨ 一鍵生成明細與總量</button>
        
        <div id="summaryArea" style="display:none;">
            <div class="section-title">📦 今日備貨總數量</div>
            <div id="totalResult" class="detail-box"></div>

            <div class="section-title">🔍 各訂單拆解明細</div>
            <div id="detailResult" class="detail-box"></div>
        </div>
    </div>

    <script>
        const config = [
            { name: '鮭魚', keys: ['鮭魚','601','602','603','801','802'] },
            { name: '五花豚', keys: ['五花豚','豚','肉','602','604','605','608','803'] },
            { name: '唐揚雞', keys: ['唐揚','堂揚','雞','603','606','607','608','301'] },
            { name: '鯛魚', keys: ['鯛魚','601','604','606','804'] },
            { name: '鱈魚', keys: ['鱈魚','605','607','302'] },
            { name: '煙燻鴨', keys: ['鴨','805'] },
            { name: '鰻魚', keys: ['鰻','806'] }
        ];
        const excludeList = ['801','802','803','804','805','806','601','602','603','604','605','606','607','608','301','302'];

        function processOrders() {
            const rawText = document.getElementById('orderInput').value;
            // 以「用餐日期」或「公司名稱」或是明顯的空行作為訂單分割點
            const orders = rawText.split(/(?=用餐日期|公司名稱|◆|第\d+袋)/g).filter(t => t.trim().length > 5);
            
            let finalTotal = { '鮭魚': 0, '五花豚': 0, '唐揚雞': 0, '鯛魚': 0, '鱈魚': 0, '煙燻鴨': 0, '鰻魚': 0 };
            let detailHtml = '';

            orders.forEach((orderText, index) => {
                let currentOrderTotal = { '鮭魚': 0, '五花豚': 0, '唐揚雞': 0, '鯛魚': 0, '鱈魚': 0, '煙燻鴨': 0, '鰻魚': 0 };
                const lines = orderText.split('\n');
                
                lines.forEach(line => {
                    let matches = line.match(/\d+(\.\d+)?/g);
                    if (!matches) return;
                    
                    let validNums = matches.filter(n => n.length < 7 && !excludeList.includes(n));
                    let qty = validNums.length > 0 ? parseFloat(validNums[validNums.length - 1]) : 0;
                    if (qty === 0) return;

                    let isDouble = line.includes('拼') || (line.includes('60') && !line.includes('80') && !line.includes('30'));

                    config.forEach(item => {
                        if (item.keys.some(k => line.includes(k))) {
                            let rate = (isDouble && !(line.includes('80') || line.includes('30'))) ? 0.5 : 1;
                            currentOrderTotal[item.name] += (qty * rate);
                            finalTotal[item.name] += (qty * rate);
                        }
                    });
                });

                // 生成單張明細 HTML
                let orderItemsHtml = '';
                for (let name in currentOrderTotal) {
                    if (currentOrderTotal[name] > 0) orderItemsHtml += `<li>${name}: ${currentOrderTotal[name]} 份</li>`;
                }
                
                if (orderItemsHtml) {
                    detailHtml += `<div class="order-block">
                        <div class="order-header">📄 訂單 #${index + 1}</div>
                        <ul style="font-size:18px; line-height:1.6;">${orderItemsHtml}</ul>
                    </div>`;
                }
            });

            // 生成總量 HTML
            let totalHtml = '';
            for (let name in finalTotal) {
                if (finalTotal[name] > 0) {
                    totalHtml += `<div class="item-row"><span>📍 ${name}</span><span class="qty-total">${finalTotal[name]} 份</span></div>`;
                }
            }

            document.getElementById('totalResult').innerHTML = totalHtml || '無數據';
            document.getElementById('detailResult').innerHTML = detailHtml || '無數據';
            document.getElementById('summaryArea').style.display = 'block';
        }
    </script>
</body>
</html>
