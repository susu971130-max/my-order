<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>訂單自動拆解統計 6.0</title>
    <style>
        body { font-family: sans-serif; padding: 15px; background: #fdfdfd; color: #333; }
        .card { background: white; padding: 20px; border-radius: 12px; border: 3px solid #000; max-width: 700px; margin: auto; box-shadow: 8px 8px 0px #000; }
        textarea { width: 100%; height: 200px; font-size: 16px; padding: 12px; box-sizing: border-box; border: 2px solid #ccc; border-radius: 8px; margin-bottom: 10px; }
        button { width: 100%; padding: 20px; background: #FF3B30; color: #fff; border: none; border-radius: 8px; font-size: 22px; font-weight: bold; cursor: pointer; }
        .section-title { margin-top: 30px; font-size: 22px; font-weight: bold; background: #000; color: #fff; padding: 10px 15px; border-radius: 5px; }
        .detail-box { margin-top: 10px; background: #fff; border: 2px solid #ddd; padding: 15px; border-radius: 8px; }
        .order-block { margin-bottom: 25px; padding: 15px; border: 1px solid #eee; border-left: 10px solid #007AFF; background: #f9f9f9; }
        .order-header { font-weight: bold; color: #007AFF; margin-bottom: 8px; font-size: 20px; border-bottom: 1px solid #007AFF; }
        .item-row { font-size: 26px; display: flex; justify-content: space-between; padding: 8px 0; border-bottom: 1px solid #eee; }
        .qty-total { color: #FF3B30; font-weight: bold; }
        ul { list-style: none; padding: 0; margin: 0; font-size: 20px; line-height: 1.8; }
    </style>
</head>
<body>
    <div class="card">
        <h2>🍱 批量訂單自動加總</h2>
        <textarea id="orderInput" placeholder="直接把所有 LINE 訂單全部貼進來..."></textarea>
        <button onclick="process()">🚀 一鍵分析並加總</button>
        
        <div id="summaryArea" style="display:none;">
            <div class="section-title">📊 今日備貨大總計</div>
            <div id="totalResult" class="detail-box"></div>

            <div class="section-title">📃 每一張單的細項</div>
            <div id="detailResult" class="detail-box"></div>
        </div>
    </div>

    <script>
        const config = [
            { name: '鮭魚', keys: ['鮭魚','601','602','603','801','802'] },
            { name: '五花豚', keys: ['五花豚','豚','肉','602','604','605','608','803'] },
            { name: '唐揚雞', keys: ['唐揚','堂揚','雞','603','606','607','608','301'] },
            { name: '鯛魚', keys: ['鯛魚','601','604','606','804'] },
            { name: '鱈魚', keys: ['鱈魚','605','607','302'] },
            { name: '煙燻鴨', keys: ['鴨','805'] },
            { name: '鰻魚', keys: ['鰻','806'] }
        ];
        const menuIDs = ['801','802','803','804','805','806','601','602','603','604','605','606','607','608','301','302'];

        function process() {
            const rawText = document.getElementById('orderInput').value;
            // 改進的切單邏輯：只要看到關鍵標頭就切開，適應各種訂單
            const orderChunks = rawText.split(/(?=用餐日期|公司名稱|◆|第\d+袋|先生|小姐|送達時間)/g).filter(t => t.trim().length > 3);
            
            let grandTotal = { '鮭魚': 0, '五花豚': 0, '唐揚雞': 0, '鯛魚': 0, '鱈魚': 0, '煙燻鴨': 0, '鰻魚': 0 };
            let detailHtml = '';

            orderChunks.forEach((chunk, i) => {
                let chunkTotal = { '鮭魚': 0, '五花豚': 0, '唐揚雞': 0, '鯛魚': 0, '鱈魚': 0, '煙燻鴨': 0, '鰻魚': 0 };
                const lines = chunk.split('\n');
                let orderTitle = chunk.split('\n')[0].substring(0, 20); // 抓第一行當標題

                lines.forEach(line => {
                    let nums = line.match(/\d+(\.\d+)?/g);
                    if (!nums) return;

                    // 過濾掉電話、統編與編號，抓出真正的數量
                    let valid = nums.filter(n => n.length < 7 && !menuIDs.includes(n));
                    if (valid.length === 0) return;
                    let qty = parseFloat(valid[valid.length - 1]);

                    // 判斷是否為雙拼
                    let isDouble = line.includes('拼') || (line.includes('60') && !line.includes('80') && !line.includes('30'));

                    config.forEach(item => {
                        if (item.keys.some(k => line.includes(k))) {
                            let rate = (isDouble && !(line.includes('80') || line.includes('30'))) ? 0.5 : 1;
                            chunkTotal[item.name] += (qty * rate);
                            grandTotal[item.name] += (qty * rate);
                        }
                    });
                });

                let itemsHtml = '';
                for (let n in chunkTotal) {
                    if (chunkTotal[n] > 0) itemsHtml += `<li>📍 ${n}: ${chunkTotal[n]} 份</li>`;
                }

                if (itemsHtml) {
                    detailHtml += `<div class="order-block">
                        <div class="order-header">單據 #${i+1}: ${orderTitle}...</div>
                        <ul>${itemsHtml}</ul>
                    </div>`;
                }
            });

            let totalHtml = '';
            for (let n in grandTotal) {
                if (grandTotal[n] > 0) totalHtml += `<div class="item-row"><span>${n}</span><span class="qty-total">${grandTotal[n]} 份</span></div>`;
            }

            document.getElementById('totalResult').innerHTML = totalHtml || '查無數據';
            document.getElementById('detailResult').innerHTML = detailHtml || '查無數據';
            document.getElementById('summaryArea').style.display = 'block';
        }
    </script>
</body>
</html>
